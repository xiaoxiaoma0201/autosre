<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSRE 控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .header p { color: #666; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 15px; }
        .stat-card .value { color: #667eea; font-size: 36px; font-weight: bold; }
        .incident-list {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .incident-list h2 { color: #333; margin-bottom: 20px; }
        .incident-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .incident-item:last-child { border-bottom: none; }
        .incident-id { color: #667eea; font-weight: bold; font-size: 14px; }
        .incident-time { color: #999; font-size: 12px; margin-top: 5px; }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-completed { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .button:hover { background: #5a67d8; }
        .loading { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AutoSRE 控制台</h1>
            <p>多 Agent 自动化运维排障系统</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>总故障数</h3>
                <div class="value" id="totalIncidents">-</div>
            </div>
            <div class="stat-card">
                <h3>成功处理</h3>
                <div class="value" id="completedIncidents">-</div>
            </div>
            <div class="stat-card">
                <h3>总告警数</h3>
                <div class="value" id="totalAlerts">-</div>
            </div>
            <div class="stat-card">
                <h3>成功率</h3>
                <div class="value" id="successRate">-</div>
            </div>
        </div>
        
        <button class="button" onclick="refreshData()">🔄 刷新数据</button>
        
        <div class="incident-list">
            <h2>📋 最近的故障记录</h2>
            <div id="incidentList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>
    
    <script>
        async function refreshData() {
            try {
                const statsResponse = await fetch('/api/v1/stats');
                const stats = await statsResponse.json();
                
                document.getElementById('totalIncidents').textContent = stats.total_incidents || 0;
                document.getElementById('completedIncidents').textContent = stats.completed_incidents || 0;
                document.getElementById('totalAlerts').textContent = stats.total_alerts || 0;
                document.getElementById('successRate').textContent = 
                    ((stats.success_rate || 0) * 100).toFixed(1) + '%';
                
                const incidentsResponse = await fetch('/api/v1/incidents/recent');
                const incidents = await incidentsResponse.json();
                
                const incidentList = document.getElementById('incidentList');
                incidentList.innerHTML = '';
                
                if (incidents.length === 0) {
                    incidentList.innerHTML = '<div class="loading">暂无故障记录</div>';
                } else {
                    incidents.forEach(incident => {
                        const item = document.createElement('div');
                        item.className = 'incident-item';
                        
                        const statusClass = incident.status === 'completed' ? 'status-completed' : 'status-failed';
                        const shortId = incident.id ? incident.id.substring(0, 20) + '...' : 'unknown';
                        
                        item.innerHTML = '<div>' +
                            '<div class="incident-id">' + shortId + '</div>' +
                            '<div class="incident-time">' + (incident.timestamp || '') + '</div>' +
                            '</div>' +
                            '<span class="status-badge ' + statusClass + '">' + incident.status + '</span>';
                        
                        incidentList.appendChild(item);
                    });
                }
            } catch (error) {
                console.error('刷新数据失败:', error);
                document.getElementById('incidentList').innerHTML = 
                    '<div class="loading">加载失败，请检查 API 服务器</div>';
            }
        }
        
        refreshData();
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
