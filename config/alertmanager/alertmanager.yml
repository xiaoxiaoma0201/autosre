global:
  resolve_timeout: 5m

route:
  receiver: 'autosre-webhook'
  group_by: ['alertname', 'service', 'instance']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
- name: 'autosre-webhook'
  webhook_configs:
  - url: 'http://host.docker.internal:8888/api/v1/incidents/sync'
    send_resolved: true
