networks:
  autosre-net:
    driver: bridge

services:
  mock-app:
    build:
      context: ./mock-app
    container_name: autosre-flask
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mysql
    networks:
      - autosre-net
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: autosre-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-app
    networks:
      - autosre-net
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: autosre-redis
    ports:
      - "6379:6379"
    networks:
      - autosre-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: autosre-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - autosre-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: autosre-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - autosre-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: autosre-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - autosre-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: autosre-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - autosre-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: autosre-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - autosre-net
    restart: unless-stopped

volumes:
  mysql_data:
  prom_data:
  grafana_data:
